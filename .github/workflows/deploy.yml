name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            APP_DIR="/home/ubuntu/app-$TIMESTAMP"

            echo "Creating new deployment folder: $APP_DIR"
            mkdir -p $APP_DIR
            cd $APP_DIR

            # Clone the repository
            git clone https://github.com/Ashwin2634/Farmer-intelligence-platform.git .

            # ====================== FRONTEND ======================
            echo "Setting up Frontend..."
            cd $APP_DIR/frontend
            npm install

            # ====================== BACKEND ======================
            echo "Setting up Backend..."
            cd $APP_DIR/backend
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Download ML model
            echo "Downloading ML model..."
            mkdir -p $APP_DIR/backend/disease_detection/models/trained
            cd $APP_DIR/backend/disease_detection/models/trained
            gdown ${{ secrets.GDRIVE_FILE_ID }}

            # ====================== CREATE ecosystem.config.js ======================
            echo "Creating ecosystem.config.js..."
            cat > $APP_DIR/ecosystem.config.js << EOF
            module.exports = {
              apps: [
                {
                  name: "frontend",
                  script: "server.js",
                  cwd: "$APP_DIR/frontend",
                  instances: 1,
                  autorestart: true,
                  watch: false,
                  max_memory_restart: "500M"
                },
                {
                  name: "backend",
                  script: "$APP_DIR/backend/venv/bin/uvicorn",
                  args: "app.main:app --host 0.0.0.0 --port 8000 --workers 2",
                  cwd: "$APP_DIR/backend",
                  interpreter: "none",
                  instances: 1,
                  exec_mode: "fork",
                  autorestart: true,
                  watch: false,
                  max_memory_restart: "1G"
                }
              ]
            };
            EOF

            # ====================== PM2 ======================
            echo "Stopping all existing PM2 processes..."
            pm2 delete all || true
            pm2 flush || true

            echo "Starting apps with ecosystem.config.js..."
            cd $APP_DIR
            pm2 start ecosystem.config.js

            pm2 save

            echo "========================================="
            echo "Deployment successful!"
            echo "App folder → $APP_DIR"
            echo "Frontend  → pm2 name: frontend"
            echo "Backend   → pm2 name: backend"
            echo "========================================="

            # Keep only last 3 deployments to save space
            cd /home/ubuntu
            ls -dt app-* | tail -n +4 | xargs -r rm -rf